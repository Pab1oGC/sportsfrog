name: sportfrog

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: sportfrog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: 5432
      SPORTFROG_OWNER_USER: ${SPORTFROG_OWNER_USER}
      SPORTFROG_OWNER_PASSWORD: ${SPORTFROG_OWNER_PASSWORD}
      SPORTFROG_APP_PASSWORD: ${SPORTFROG_APP_PASSWORD}
      SPORTFROG_PUBLIC_PASSWORD: ${SPORTFROG_PUBLIC_PASSWORD}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - net_db

  minio:
    image: docker.io/pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: sportfrog-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MINIO_PORT}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio-data:/data
    # Sin healthcheck: "mc ready local" nunca termina en esta imagen (el alias
    # "local" no existe) y dejaba a la API esperando para siempre.
    networks:
      - net_services

  # Aplica las migraciones y termina. El deploy lo ejecuta antes de la API.
  migrate:
    image: ghcr.io/frogtech-solutions/sport-frog/sportfrog-migrations
    container_name: sportfrog-migrate
    restart: "no"
    environment:
      SPORTFROG_MIGRATIONS_CONNECTION: "Host=sportfrog-postgres;Port=5432;Database=${POSTGRES_DB};Username=${SPORTFROG_OWNER_USER};Password=${SPORTFROG_OWNER_PASSWORD}"
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD}
    depends_on:
      - postgres
    networks:
      - net_db

  # Validador de fotos (OFIQ). Solo lo consume la API, por una red propia.
  validador:
    image: ghcr.io/frogtech-solutions/sport-frog/sportfrog-validador
    container_name: sportfrog-validador
    restart: unless-stopped
    # OFIQ carga modelos de ~430 MB por proceso
    mem_limit: 2g
    networks:
      - validador_net

  api:
    image: ghcr.io/frogtech-solutions/sport-frog/sportfrog-api
    container_name: sportfrog-api
    restart: unless-stopped
    mem_limit: 1g
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Default: "Host=sportfrog-postgres;Port=5432;Database=${POSTGRES_DB};Username=sportfrog_app;Password=${SPORTFROG_APP_PASSWORD}"
      ConnectionStrings__Public: "Host=sportfrog-postgres;Port=5432;Database=${POSTGRES_DB};Username=sportfrog_public;Password=${SPORTFROG_PUBLIC_PASSWORD}"
      Authentication__Jwt__SigningKey: ${Authentication__Jwt__SigningKey}
      Documents__VerificationBaseUrl: ${VERIFICATION_BASE_URL:-http://localhost:5173/verificar}
      Storage__Endpoint: "http://minio:9000"
      Storage__PublicUrl: ${STORAGE_ENDPOINT:-}
      Storage__Bucket: "sportfrog"
      Storage__AccessKey: ${MINIO_ROOT_USER}
      Storage__SecretKey: ${MINIO_ROOT_PASSWORD}
      Smtp__Host: ${Smtp__Host:-}
      Smtp__Port: ${Smtp__Port:-587}
      Smtp__Username: ${Smtp__Username:-}
      Smtp__Password: ${Smtp__Password:-}
      Smtp__UseStartTls: ${Smtp__UseStartTls:-true}
      Smtp__FromAddress: ${Smtp__FromAddress:-}
      Smtp__FromName: ${Smtp__FromName:-SportFrog}
      Validador__Url: "http://sportfrog-validador:8000"
    ports:
      - "127.0.0.1:${API_PORT}:8080"
    depends_on:
      - minio
    networks:
      - net_db
      - net_services
      - validador_net

  web:
    image: ghcr.io/frogtech-solutions/sport-frog/sportfrog-web
    container_name: sportfrog-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT}:80"
    depends_on:
      - api
    networks:
      - net_services

volumes:
  postgres-data:
  minio-data:

networks:
  validador_net:
    name: sportfrog-validador-net
  net_services:
    external: true
  net_db:
    external: true