name: Build and Deploy

on:
  push:
    branches:
      - develop
      - main

env:
  API_IMAGE: ghcr.io/${{ github.repository }}/sportfrog-api:latest
  WEB_IMAGE: ghcr.io/${{ github.repository }}/sportfrog-web:latest
  SERVER_DEPLOY_PATH: /home/deployuser/sportfrog

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
            web:
              - 'web/**'

  build-api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: ${{ env.API_IMAGE }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  build-web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: ${{ env.WEB_IMAGE }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: [changes, build-api, build-web]
    if: |
      always() &&
      (needs.build-api.result == 'success' || needs.build-api.result == 'skipped') &&
      (needs.build-web.result == 'success' || needs.build-web.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ${{ env.SERVER_DEPLOY_PATH }}

            echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

            cat > docker-compose.override.yml <<'EOF'
            services:
              api:
                image: ${{ env.API_IMAGE }}
                build: null
              web:
                image: ${{ env.WEB_IMAGE }}
                build: null
            EOF

            podman-compose -f podman-compose.yml pull
            podman-compose -f podman-compose.yml --profile full up -d --force-recreate

            podman logout ghcr.io

  migrate:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SERVER_HOST }}
          username: pasantes
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            podman exec sportfrog-postgres dotnet tool install --global dotnet-ef --version 10.0.4 2>/dev/null
            podman exec sportfrog-postgres dotnet ef database update --project /app/src/SportFrog.Api || echo "Sin migraciones pendientes o ya aplicadas"
