# Qué visitantes son en realidad un rastreador de vista previa (WhatsApp,
# Facebook, Twitter/X, Telegram, Slack, Discord, LinkedIn...) en vez de un
# navegador de verdad. Ninguno de ellos ejecuta el JavaScript de la SPA, así
# que ven el <head> vacío de siempre y la tarjeta sale sin nombre, sin
# imagen y sin descripción — este mapa es lo único que decide a quién
# redirigir en su lugar al resumen que sí entiende cada uno (ver el location
# de /public/ más abajo y ReadPublicCompetitionPreview del lado de la API).
map $http_user_agent $es_rastreador_de_enlace {
    default 0;
    "~*facebookexternalhit" 1;
    "~*Facebot" 1;
    "~*Twitterbot" 1;
    "~*WhatsApp" 1;
    "~*TelegramBot" 1;
    "~*LinkedInBot" 1;
    "~*Slackbot" 1;
    "~*Discordbot" 1;
    "~*SkypeUriPreview" 1;
    "~*vkShare" 1;
    "~*Pinterest" 1;
    "~*redditbot" 1;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # La API, bajo el mismo origen que el sitio — el mismo trato que ya da
    # el proxy de Vite en desarrollo (ver web/vite.config.js): sin CORS, sin
    # preflight, y las cookies funcionan sin necesitar SameSite=None.
    #
    # "^~" para que esto gane siempre frente al location de assets estaticos
    # de mas abajo, que por regex tendria prioridad aunque sea menos
    # especifico — nginx elige asi por defecto, y una ruta de la API que por
    # casualidad terminara en ".json" hubiera caido en el location
    # equivocado.
    location ^~ /api/ {
        proxy_pass http://api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Los objetos guardados (fotos, logos, credenciales, artes). La API firma
    # cada link contra el endpoint interno (Storage__Endpoint, siempre
    # "http://minio:9000") y despues le cambia el host a esta direccion
    # publica antes de entregarlo — ver ObjectStore.Rehost y
    # Storage__PublicUrl en .env.example.
    #
    # "proxy_set_header Host minio:9000" fijo — no "$host" ni $proxy_host
    # implicito — porque tiene que ser exactamente el host contra el que se
    # calculo la firma (SignedHeaders=host). Reenviar el host que puso el
    # navegador (esta misma direccion publica) hace que MinIO recalcule la
    # firma sobre un host distinto del firmado, y cada objeto responde 403
    # SignatureDoesNotMatch — probado a mano, el default de nginx sin esta
    # linea no alcanza.
    location ^~ /sportfrog/ {
        proxy_pass http://minio:9000;
        proxy_set_header Host minio:9000;
    }

    # Cacheado largo para lo que Vite ya nombra con un hash por contenido —
    # un archivo que cambia de contenido cambia de nombre, asi que no hay
    # riesgo de servir una version vieja bajo cache.
    location ~* \.(?:js|css|svg|woff2?|png|jpg|jpeg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # La página de una competencia, para quien la comparte. Solo estas dos
    # partes del address — no /public a secas (el directorio), no
    # /public/.../verify/... (la verificación de un documento) — son la
    # tarjeta que vale la pena que se vea bien en un link compartido.
    #
    # "rewrite ... last" y no "proxy_pass" acá directamente: relanza la
    # búsqueda de location con la URL ya reescrita a /api/public/.../
    # preview.html, que es la que matchea el location "^~ /api/" de más
    # arriba — así el proxy hacia la API se define en un solo lugar en vez
    # de repetirse en los dos locations que necesitan llegar ahí.
    location ~ ^/public/([^/]+)/([^/]+)/?$ {
        if ($es_rastreador_de_enlace) {
            rewrite ^/public/([^/]+)/([^/]+)/?$ /api/public/$1/$2/preview.html last;
        }

        try_files $uri /index.html;
    }

    # La SPA: cualquier ruta que no matcheo arriba la resuelve React Router
    # del lado del cliente, no un archivo que nginx tenga que encontrar.
    location / {
        try_files $uri /index.html;
    }
}
